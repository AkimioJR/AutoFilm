name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yaml"
      - ".github/workflows/build-binary.yaml"
      - ".github/workflows/build-docker.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "alist-client-rs/**"
      - "config/config.example.yaml"
      - "docker/Dockerfile.ci"

jobs:
  build-binary:
    uses: ./.github/workflows/build-binary.yaml

  build-docker:
    needs: build-binary
    uses: ./.github/workflows/build-docker.yaml
    with:
      push: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [build-binary, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/input

      # 根据可执行二进制文件的后缀进行打包，如果无后缀，则使用tar.gz格式，如果是exe，则使用zip格式
      # 打包后的文件名为 AutoFilm-<target>.<ext>
      # 打包内容有可执行二进制文件、LICENSE、config/config.example.yaml、README.md
      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail

          input_dir="${GITHUB_WORKSPACE}/dist/input"
          output_dir="${GITHUB_WORKSPACE}/dist/release"
          mkdir -p "${output_dir}"

          for artifact_dir in "${input_dir}"/*; do
            [[ -d "${artifact_dir}" ]] || continue

            target="$(basename "${artifact_dir}")"
            package_dir="${GITHUB_WORKSPACE}/dist/package/${target}"

            mkdir -p "${package_dir}"

            shopt -s nullglob
            bins=("${artifact_dir}"/*)
            shopt -u nullglob

            if (( ${#bins[@]} != 1 )); then
              echo "Expected exactly one binary in ${artifact_dir}, found ${#bins[@]}" >&2
              exit 1
            fi

            bin_path="${bins[0]}"
            bin_name="$(basename "${bin_path}")"

            cp "${bin_path}" "${package_dir}/${bin_name}"
            cp LICENSE "${package_dir}/LICENSE"
            cp config/config.example.yaml "${package_dir}/config.example.yaml"
            cp README.md "${package_dir}/README.md"

            pushd "${package_dir}" > /dev/null

            if [[ "${bin_name}" == *.exe ]]; then
              zip -r "${output_dir}/AutoFilm-${target}.zip" "${bin_name}" LICENSE config.example.yaml README.md
            else
              chmod +x "${bin_name}"
              tar czf "${output_dir}/AutoFilm-${target}.tar.gz" "${bin_name}" LICENSE config.example.yaml README.md
            fi

            popd > /dev/null
          done

      # tag 触发时发布为 latest 版本；main 分支 push / 手动触发时发布为 pre-latest 版本
      - name: Determine release tag
        id: release_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_name=pre-release" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          fi

      # 优先从 CHANGELOG.md 中提取当前发布版本的详细说明（严格过滤 --- 分割线及下方的比对链接）；
      # 若为预发布（pre-release）或未在 CHANGELOG.md 找到对应章节，则回退为根据 Git 提交记录自动生成。
      - name: Generate Release Body
        id: release_body
        run: |
          set -euo pipefail

          TAG_NAME="${{ steps.release_tag.outputs.tag_name }}"

          if [[ "${{ steps.release_tag.outputs.prerelease }}" == "true" ]]; then
            COMPOSE_IMAGE_TAG="main"
          else
            COMPOSE_IMAGE_TAG="${TAG_NAME}"
          fi

          # 获取上一个版本 tag：tag 触发时排除当前版本，其余情况取最新版本 tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PREVIOUS_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)
          else
            PREVIOUS_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          fi
          echo "Previous tag: ${PREVIOUS_TAG}"

          CHANGELOG=""

          # 1. 正式版本发布时（非 pre-release），优先从 CHANGELOG.md 中提取对应版本的说明
          # 提取当前版本从 ## [版本] 开始，到下一个 ## [ 或 --- 分割线前的内容，避免将底部的比对链接引入 release body
          if [[ "${{ steps.release_tag.outputs.prerelease }}" == "false" ]] && [ -f CHANGELOG.md ]; then
            RAW_CHANGELOG=$(awk -v ver="${TAG_NAME#v}" '
              BEGIN { in_section = 0 }
              $0 ~ "^## \\[" {
                if (in_section) exit
                if ($0 ~ "^## \\[" ver "\\]") {
                  in_section = 1
                  next
                }
              }
              in_section {
                if ($0 ~ "^---+" || $0 ~ "^<!--" || $0 ~ "^\\[[^\\]]+\\]:") exit
                print
              }
            ' CHANGELOG.md | sed '/./,$!d' || true)

            if [ -n "$RAW_CHANGELOG" ]; then
              CHANGELOG="$RAW_CHANGELOG"
            fi
          fi

          # 2. 如果未能从 CHANGELOG.md 中提取（例如滚动预发布 pre-release），则基于上一个 tag 到 HEAD 的提交记录自动分类生成
          if [ -z "$CHANGELOG" ]; then
            if [ -z "${PREVIOUS_TAG}" ]; then
              COMMITS=$(git log --pretty=format:"%s||%an" HEAD)
            else
              COMMITS=$(git log --pretty=format:"%s||%an" "${PREVIOUS_TAG}..HEAD")
            fi

            declare -A SEEN
            FEATURES=""
            FIXES=""
            OTHERS=""

            while IFS= read -r line; do
              if [ -z "$line" ]; then
                continue
              fi

              msg=$(echo "$line" | sed 's/||[^|]*$//')
              author=$(echo "$line" | sed 's/.*||//')

              if echo "$msg" | grep -qE "^Merge pull request|^Merge branch|^chore\(release\)|^更新 version"; then
                continue
              fi

              if echo "$msg" | grep -qiE "^(feat|perfect)(\(.+\))?:"; then
                desc=$(echo "$msg" | sed -E 's/^(feat|perfect)(\([^)]*\))?:[[:space:]]*//')
                category="FEATURES"
              elif echo "$msg" | grep -qiE "^fix(\(.+\))?:"; then
                desc=$(echo "$msg" | sed -E 's/^fix(\([^)]*\))?:[[:space:]]*//')
                category="FIXES"
              elif echo "$msg" | grep -qiE "^(docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?:"; then
                desc=$(echo "$msg" | sed -E 's/^(docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?:[[:space:]]*//')
                category="OTHERS"
              else
                desc="$msg"
                category="OTHERS"
              fi

              dedup_key="${category}::${desc}"
              if [ -n "${SEEN[$dedup_key]+x}" ]; then
                continue
              fi
              SEEN[$dedup_key]=1

              entry="- ${desc} by @${author}"

              case "$category" in
                FEATURES) FEATURES="${FEATURES}${entry}"$'\n' ;;
                FIXES)    FIXES="${FIXES}${entry}"$'\n' ;;
                OTHERS)   OTHERS="${OTHERS}${entry}"$'\n' ;;
              esac
            done <<< "$COMMITS"

            if [ -n "$FEATURES" ]; then
              CHANGELOG="${CHANGELOG}### ✨ 新功能"$'\n\n'"${FEATURES}"$'\n'
            fi

            if [ -n "$FIXES" ]; then
              CHANGELOG="${CHANGELOG}### 🐛 修复"$'\n\n'"${FIXES}"$'\n'
            fi

            if [ -n "$OTHERS" ]; then
              CHANGELOG="${CHANGELOG}### 🔧 其他"$'\n\n'"${OTHERS}"$'\n'
            fi
          fi

          # 3. 组装最终 Release Body
          BODY="${CHANGELOG}"

          # 添加版本对比链接
          if [ -n "${PREVIOUS_TAG}" ]; then
            if [ -n "${BODY}" ]; then
              BODY="${BODY}"$'\n\n'
            fi
            BODY="${BODY}**完整更新记录**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG_NAME}"
          fi

          # 添加 Docker compose.yaml 配置示例。预发布使用 main，正式发布使用对应的 v* tag。
          COMPOSE_CONTENT=$(sed -E "s|(image:[[:space:]]+akimio/autofilm:)[^[:space:]#]+|\\1${COMPOSE_IMAGE_TAG}|" docker/compose.yaml)
          BODY="${BODY}"$'\n\n### 🐳 Docker Compose 配置示例\n\n```yaml\n'"${COMPOSE_CONTENT}"$'\n```'

          # 添加 config.yaml 配置示例
          CONFIG_CONTENT=$(cat config/config.example.yaml)
          BODY="${BODY}"$'\n\n### ⚙️ config.yaml 配置示例\n\n```yaml\n'"${CONFIG_CONTENT}"$'\n```'

          # 使用 heredoc 写入多行输出
          {
            echo "body<<EOF"
            echo "${BODY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # 保持所有预发布版本共用一个 tag，并将其移动到本次构建的提交。
      # 正式版本由 v* tag 触发，不会执行该步骤。
      - name: Update rolling pre-release tag
        if: ${{ steps.release_tag.outputs.prerelease == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force pre-release "${GITHUB_SHA}"
          git push --force origin refs/tags/pre-release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          body: ${{ steps.release_body.outputs.body }}
          files: |
            dist/release/AutoFilm*
