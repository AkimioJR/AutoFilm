[package]
name = "autofilm"
version = "2.0.0"
edition = "2024"
authors = ["AkimioJR"]
repository = "https://github.com/AkimioJR/AutoFilm"
description = "一个为Emby、Jellyfin提供生成strm、动漫追番、绘制媒体库海报的小工具"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
alist = { package = "alist-client-rs", path = "alist-client-rs" }
ab_glyph = "0.2.32"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10"
futures-util = "0.3.33"
iana-time-zone = "0.1"
image = { version = "0.25.8", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
imageproc = "0.27.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "json",
    "query",
    "rustls",
    "stream",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-cron-scheduler = "0.15.1"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
urlencoding = "2.1.3"

[build-dependencies]
chrono = "0.4.45"


[profile.release]
# 控制 LLVM 将单个 Crate 拆分为1个“代码生成单元”进行并行编译。
# 极大提升代码优化空间（更多的内联机会、更彻底的死代码消除），显著减小二进制体积；
# 代价是 Release 模式下的编译速度会变慢。
codegen-units = 1
# "thin": Thin 模式的链接时优化（Link-Time Optimization）
# "fat": 优化空间更大，体积更小
lto = "fat"
# 3: 性能优先
# "s": 体积优先
# "z": 极致体积优先
opt-level = 3
# 在编译产物中自动剥离（Strip）调试信息和符号表
strip = "symbols"
